[package]
name = "openblock-link-offline"
version = "0.1.0"
description = "Tauri wrapper for OpenBlock Link offline desktop builds."
authors = ["DoGoBlock"]
edition = "2021"

[lib]
name = "openblock_link_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

